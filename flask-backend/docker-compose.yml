x-flask-image: &flask-image flask-app:v3.2.0  # <== Set your version/tag here ONCE

services:
  flask-app-builder:
    build:
      context: .
      dockerfile: Dockerfile.flask
    image: *flask-image
    container_name: flask-app-builder
    runtime: nvidia
    networks:
      - app-network

  flask-app-1:
    image: *flask-image
    container_name: flask-app-1
    runtime: nvidia
    ports:
      - "5000:5000"
    volumes:
      - .:/flask-app
    networks:
      - app-network

  flask-app-2:
    image: *flask-image
    container_name: flask-app-2
    runtime: nvidia
    ports:
      - "5001:5000"
    volumes:
      - .:/flask-app
    networks:
      - app-network

  flask-app-3:
    image: *flask-image
    container_name: flask-app-3
    runtime: nvidia
    ports:
      - "5002:5000"
    volumes:
      - .:/flask-app
    networks:
      - app-network

  flask-app-4:
    image: *flask-image
    container_name: flask-app-4
    runtime: nvidia
    ports:
      - "5003:5000"
    volumes:
      - .:/flask-app
    networks:
      - app-network

  flask-app-5:
    image: *flask-image
    container_name: flask-app-5
    runtime: nvidia
    ports:
      - "5004:5000"
    volumes:
      - .:/flask-app
    networks:
      - app-network

  nextjs:
    build:
      context: C:/Users/faith/Snapfolia/production/nextjs-frontend
      dockerfile: Dockerfile
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - flask-app-1
      - flask-app-2
      - flask-app-3
      - flask-app-4
      - flask-app-5
      - nextjs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge